name: Validacao PI Etapa 9

on:
  push:
    branches:
      - etapa9-validacao
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Reconstruir projeto da Etapa 9
        run: |
          mkdir -p etapa9-build
          cat validation/etapa9/part*.b64 | base64 -d > /tmp/etapa9.tar.gz
          tar -xzf /tmp/etapa9.tar.gz -C etapa9-build
          test -f etapa9-build/pom.xml

      - name: Aplicar correcao BUG-002 ao pacote de validacao
        working-directory: etapa9-build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pom.xml')
          s = p.read_text()
          old = '<artifactId>thymeleaf-extras-java8time</artifactId>\n        </dependency>'
          new = '<artifactId>thymeleaf-extras-java8time</artifactId>\n            <version>3.0.4.RELEASE</version>\n        </dependency>'
          if old in s:
              p.write_text(s.replace(old, new))
          PY

      - name: Executar testes JUnit e integracao
        working-directory: etapa9-build
        run: mvn --batch-mode clean test
